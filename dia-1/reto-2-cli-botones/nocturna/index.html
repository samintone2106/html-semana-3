<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueda Nocturna · Rueda Libre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-950 text-slate-100 font-['Sora',sans-serif]">
  <main>
    <!-- Sección principal -->
    <section class="mx-auto max-w-3xl px-4 py-20 sm:px-8 sm:py-28">
      <div class="space-y-6">
        <p class="inline-block rounded-lg bg-amber-400/10 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-amber-300">
          Nuevo · Jueves a sábado
        </p>

        <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-white sm:text-7xl">
          Rueda Nocturna
        </h1>

        <p class="max-w-xl text-lg leading-relaxed text-slate-300 sm:text-xl">
          Descubre Medellín en bici cuando se encienden las luces
        </p>

        <ul class="flex flex-wrap gap-4 pt-2">
          <li class="w-40 rounded-2xl bg-slate-900 p-4">
            <span class="block text-2xl font-bold text-amber-300">3 rutas</span>
            <span class="block text-xs uppercase tracking-wider text-slate-400">por la ciudad</span>
          </li>
          <li class="w-40 rounded-2xl bg-slate-900 p-4">
            <span class="block text-2xl font-bold text-amber-300">Desde $55.000</span>
            <span class="block text-xs uppercase tracking-wider text-slate-400">por persona</span>
          </li>
        </ul>

        <div class="flex flex-wrap gap-4 pt-2">
          <!-- Botón principal -->
          <a href="#rutas"
             class="inline-block rounded-lg border-2 border-amber-400 bg-amber-400 px-6 py-3 text-base font-semibold text-slate-950 shadow-lg shadow-amber-400/20 transition-colors hover:border-amber-300 hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-300/60 focus:ring-offset-2 focus:ring-offset-slate-950">
            Inscríbete
          </a>
          <!-- Botón secundario -->
          <a href="#rutas"
             class="inline-block rounded-lg border-2 border-slate-800 bg-slate-800 px-6 py-3 text-base font-semibold text-slate-100 transition-colors hover:border-slate-700 hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-slate-400/60 focus:ring-offset-2 focus:ring-offset-slate-950">
            Ver rutas
          </a>
          <!-- Botón de contorno -->
          <a href="#incluye"
             class="inline-block rounded-lg border-2 border-amber-400 bg-transparent px-6 py-3 text-base font-semibold text-amber-300 transition-colors hover:bg-amber-400/10 focus:outline-none focus:ring-4 focus:ring-amber-300/60 focus:ring-offset-2 focus:ring-offset-slate-950">
            ¿Qué incluye?
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
